[project]
name = "wiki-mcp"
version = "0.1.0"
description = "Rolf's wiki for chat apps (ChatGPT, claude.ai, Cowork): an MCP bridge over the vault command"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.2.0",
]

[project.scripts]
wiki-mcp = "wiki_mcp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
